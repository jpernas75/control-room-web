databases:
  - name: control-room-db
    plan: basic_256mb
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: control-room-web
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: npm ci && npx prisma generate && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: control-room-db
          property: connectionString
      - key: AUTH_SECRET
        generateValue: true
      - key: AUTH_URL
        value: https://control-room-web.onrender.com
      - key: SEED_ADMIN_PASSWORD
        sync: false
